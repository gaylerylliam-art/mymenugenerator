<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MenuCraft Pro Dashboard</title>
  <style>
    ::view-transition-group(*),
    ::view-transition-old(*),
    ::view-transition-new(*) {
      animation-duration: 0.25s;
      animation-timing-function: cubic-bezier(0.19, 1, 0.22, 1);
    }

    * { box-sizing: border-box; }
    :root {
      --ink: #17130f;
      --ink-2: #332b23;
      --muted: #74695d;
      --faint: #a99d91;
      --paper: #fffdf8;
      --cream: #f5efe4;
      --line: rgba(23, 19, 15, .11);
      --gold: #c8a34a;
      --gold-2: #fff5d5;
      --green: #2d6a4f;
      --green-2: #dcf1e8;
      --red: #bd3d30;
      --red-2: #ffe8e4;
      --blue: #1b4166;
      --blue-2: #e2edf6;
      --teal: #24766d;
      --shadow: 0 20px 60px rgba(35, 24, 15, .12);
      --radius: 8px;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eee7da;
      color: var(--ink);
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }

    .app {
      display: grid;
      grid-template-columns: 224px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      background: #15120f;
      color: #efe8db;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      gap: 10px;
      align-items: center;
      padding: 4px 6px 12px;
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    .mark {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      background: var(--gold);
      color: var(--ink);
      display: grid;
      place-items: center;
      font-weight: 800;
    }

    .brand strong { display: block; font-size: 14px; }
    .brand span { display: block; font-size: 10px; color: rgba(239,232,219,.52); margin-top: 2px; }

    .nav-group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: rgba(239,232,219,.35);
      padding: 0 8px;
      margin-top: 2px;
    }

    .nav {
      display: grid;
      gap: 3px;
    }

    .nav button {
      border: 0;
      width: 100%;
      background: transparent;
      color: rgba(239,232,219,.68);
      border-radius: 7px;
      padding: 9px 10px;
      display: flex;
      gap: 9px;
      align-items: center;
      text-align: left;
      font-size: 13px;
    }

    .nav button:hover { background: rgba(255,255,255,.06); color: #fff8ea; }
    .nav button.active { background: rgba(200,163,74,.16); color: var(--gold); }
    .nav .count { margin-left: auto; font-size: 10px; color: inherit; background: rgba(255,255,255,.08); padding: 2px 7px; border-radius: 999px; }

    .plan {
      margin-top: auto;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 8px;
      padding: 12px;
      background: rgba(255,255,255,.04);
    }

    .plan small { color: var(--gold); text-transform: uppercase; font-size: 10px; letter-spacing: .08em; }
    .plan strong { display: block; margin: 5px 0 2px; font-size: 13px; }
    .meter { height: 4px; border-radius: 99px; background: rgba(255,255,255,.1); margin: 10px 0; overflow: hidden; }
    .meter div { height: 100%; width: 62%; background: var(--gold); }

    .main {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: 64px;
      background: rgba(255,253,248,.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .page-name { min-width: 230px; }
    .page-name h1 { font-size: 18px; margin: 0; font-weight: 760; }
    .page-name p { font-size: 12px; margin: 2px 0 0; color: var(--muted); }

    .search {
      flex: 1;
      max-width: 520px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 10px 12px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: var(--muted);
      font-size: 13px;
    }

    .search input { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; color: var(--ink); }

    .top-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
    .btn {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink-2);
      border-radius: 7px;
      min-height: 36px;
      padding: 8px 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 650;
    }
    .btn.dark { background: var(--ink); color: #fff8eb; border-color: var(--ink); }
    .btn.gold { background: var(--gold); color: var(--ink); border-color: var(--gold); }
    .btn.icon { width: 36px; padding: 0; }
    .btn.danger { color: var(--red); }
    .btn.danger:hover { background: #fee2e2; border-color: #fecaca; color: #991b1b; }
    .flag-switch { position: relative; width: 44px; height: 24px; display: inline-block; flex: none; }
    .flag-switch input { opacity: 0; width: 0; height: 0; }
    .flag-switch span { position: absolute; cursor: pointer; inset: 0; background: #d9d0c0; border-radius: 999px; transition: .2s; }
    .flag-switch span::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
    .flag-switch input:checked + span { background: var(--gold); }
    .flag-switch input:checked + span::before { transform: translateX(20px); }

    .screen { display: none; padding: 20px 22px 28px; }
    .screen.active { display: block; }

    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
    .split { display: grid; grid-template-columns: minmax(0,1.3fr) minmax(320px,.7fr); gap: 12px; align-items: start; }

    .card, .panel {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(255,255,255,.65) inset;
    }

    .card { padding: 15px; }
    .panel { overflow: hidden; }
    .panel-head {
      min-height: 48px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .panel-title { font-size: 13px; font-weight: 760; display: flex; align-items: center; gap: 7px; }
    .panel-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .panel-body { padding: 14px; }

    .kpi .label { color: var(--muted); font-size: 12px; }
    .kpi .value { font-size: 28px; font-weight: 780; margin: 8px 0 3px; }
    .kpi .trend { font-size: 11px; color: var(--green); }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .row:last-child { border-bottom: 0; }
    .thumb {
      width: 42px;
      height: 42px;
      border-radius: 7px;
      display: grid;
      place-items: center;
      color: white;
      font-weight: 800;
      background:
        linear-gradient(135deg, rgba(255,255,255,.2), rgba(0,0,0,.18)),
        var(--gold);
      flex: none;
      overflow: hidden;
    }
    .food-1 { background: linear-gradient(135deg,#7b3e1d,#e4ad58); }
    .food-2 { background: linear-gradient(135deg,#2d6a4f,#d7a74b); }
    .food-3 { background: linear-gradient(135deg,#693012,#c0392b); }
    .food-4 { background: linear-gradient(135deg,#315b91,#f0d99b); }
    .food-5 { background: linear-gradient(135deg,#52291c,#f6c868); }
    .row strong { display: block; font-size: 13px; }
    .row span { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 10px;
      font-weight: 750;
      background: var(--gold-2);
      color: #80620f;
      white-space: nowrap;
    }
    .badge.green { background: var(--green-2); color: var(--green); }
    .badge.red { background: var(--red-2); color: var(--red); }
    .badge.blue { background: var(--blue-2); color: var(--blue); }

    .tabs, .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 7px 11px;
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }
    .chip.active { background: var(--ink); color: #fff7e8; border-color: var(--ink); }

    .template-card {
      overflow: hidden;
      padding: 0;
      transition: transform .18s, border-color .18s;
    }
    .template-card:hover { transform: translateY(-2px); border-color: var(--gold); }
    .template-preview { height: 132px; padding: 16px; color: white; display: flex; flex-direction: column; justify-content: space-between; }
    .template-preview .mini-lines { display: grid; gap: 4px; }
    .template-preview .mini-lines i { display: block; height: 5px; border-radius: 4px; background: rgba(255,255,255,.5); }
    .template-info { padding: 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }

    .editor-shell {
      height: calc(100vh - 104px);
      min-height: 680px;
      display: grid;
      grid-template-columns: 262px minmax(420px, 1fr) 244px;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: var(--paper);
    }
    .editor-side, .inspector { overflow: auto; background: #fffdf9; }
    .editor-side { border-right: 1px solid var(--line); }
    .inspector { border-left: 1px solid var(--line); }
    .tool-tabs { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--line); }
    .tool-tabs button { border: 0; border-right: 1px solid var(--line); background: #fff; padding: 10px 4px; font-size: 11px; color: var(--muted); }
    .tool-tabs button.active { color: var(--ink); background: var(--cream); font-weight: 750; }
    .section-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); margin: 16px 0 8px; }
    .editor-pad { padding: 14px; }
    .item-card { border: 1px solid var(--line); border-radius: 8px; padding: 9px; display: flex; gap: 9px; align-items: center; margin-bottom: 8px; background: #fff; }
    .item-card:hover { border-color: var(--gold); }
    .item-card .price { margin-left: auto; font-weight: 760; color: #80620f; font-size: 12px; }

    .canvas-wrap {
      background: #ece3d4;
      overflow: auto;
      padding: 18px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .menu-page {
      width: 420px;
      min-height: 594px;
      background: #fffdf8;
      box-shadow: var(--shadow);
      color: var(--ink);
      transform-origin: top center;
    }
    .menu-head {
      background: var(--menu-color, #17130f);
      color: #f7eddb;
      padding: 26px;
    }
    .menu-brand { display: flex; gap: 13px; align-items: center; }
    .menu-logo { width: 48px; height: 48px; background: var(--gold); color: var(--menu-color, #17130f); border-radius: 8px; display: grid; place-items: center; font-weight: 900; }
    .menu-title { color: var(--gold); font-family: Georgia, serif; font-size: 24px; font-weight: 700; }
    .menu-tag { color: rgba(255,248,235,.55); font-size: 10px; margin-top: 3px; text-transform: uppercase; letter-spacing: .08em; }
    .menu-contact { display: flex; gap: 16px; margin-top: 14px; color: rgba(255,248,235,.58); font-size: 10px; }
    .menu-body { padding: 20px; }
    .menu-section { margin: 16px 0 9px; display: flex; align-items: center; gap: 9px; color: #8a6817; font-size: 11px; font-weight: 800; letter-spacing: .08em; }
    .menu-section:before, .menu-section:after { content: ""; height: 1px; background: var(--line); flex: 1; }
    .menu-food { display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(23,19,15,.08); }
    .menu-food h3 { margin: 0; font-size: 13px; }
    .menu-food p { margin: 3px 0 5px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .menu-food .mprice { font-size: 13px; color: #80620f; font-weight: 800; }
    .qr-block { margin-top: 18px; background: var(--cream); border-radius: 8px; padding: 12px; text-align: center; color: var(--muted); font-size: 10px; }
    .fake-qr { width: 54px; height: 54px; margin: 7px auto; background: repeating-linear-gradient(90deg,#17130f 0 5px,#fff 5px 9px); border: 6px solid #17130f; }

    .field { display: grid; gap: 5px; margin-bottom: 11px; }
    .field label { color: var(--muted); font-size: 11px; font-weight: 700; }
    .field input, .field select, .field textarea {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 8px 9px;
      background: #fff;
      color: var(--ink);
      min-width: 0;
    }
    .swatches { display: flex; gap: 6px; flex-wrap: wrap; }
    .swatch { width: 24px; height: 24px; border-radius: 5px; border: 2px solid transparent; }
    .swatch.active { border-color: var(--ink); }

    .export-list { display: grid; gap: 7px; margin-top: 8px; }
    .export-list .btn { justify-content: flex-start; width: 100%; }

    .ai-hero {
      background: #17130f;
      color: #efe8db;
      border-radius: 8px;
      padding: 22px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }
    .ai-hero h2 { margin: 0; color: var(--gold); font-size: 22px; }
    .ai-hero p { margin: 6px 0 0; max-width: 620px; color: rgba(239,232,219,.66); line-height: 1.55; }
    .ai-card { min-height: 118px; }
    .ai-card button { margin-top: 12px; }
    .result { background: var(--cream); border-radius: 7px; padding: 12px; color: var(--ink-2); line-height: 1.55; min-height: 72px; }

    .progress-steps { display: grid; grid-template-columns: repeat(5,1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
    .progress-steps button { border: 0; border-right: 1px solid var(--line); background: #fff; padding: 10px 6px; color: var(--muted); font-size: 12px; }
    .progress-steps button:last-child { border-right: 0; }
    .progress-steps button.active { background: var(--ink); color: #fff7e8; }
    .job-row { display: grid; grid-template-columns: 1.2fr .8fr .8fr .7fr auto; gap: 10px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
    .job-row:last-child { border-bottom: 0; }
    .bar { height: 6px; background: var(--cream); border-radius: 999px; overflow: hidden; }
    .bar div { height: 100%; background: var(--gold); border-radius: inherit; width: var(--w); }

    .phone {
      width: 300px;
      background: #17130f;
      border-radius: 34px;
      padding: 12px;
      margin: auto;
      box-shadow: var(--shadow);
    }
    .phone-screen {
      height: 570px;
      overflow: auto;
      border-radius: 24px;
      background: #fffaf0;
    }
    .public-hero { background: var(--public-color, #17130f); color: #fff3db; padding: 22px 16px; }
    .public-hero h2 { margin: 0; color: var(--gold); font-family: Georgia, serif; font-size: 20px; }
    .public-hero p { margin: 3px 0 14px; color: rgba(255,243,219,.55); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
    .public-contact { display: grid; grid-template-columns: repeat(4,1fr); gap: 4px; font-size: 9px; text-align: center; color: rgba(255,243,219,.62); }
    .public-search { padding: 11px; background: #fffaf0; border-bottom: 1px solid var(--line); }
    .public-search input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; }
    .public-item { display: flex; gap: 9px; margin: 8px 11px; padding: 9px; background: #fff; border: 1px solid var(--line); border-radius: 8px; }
    .public-item strong { font-size: 12px; }
    .public-item p { font-size: 10px; color: var(--muted); margin: 3px 0; }
    .public-control-shell { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(320px, .9fr); gap: 18px; align-items: start; }
    .public-url-row { display: grid; grid-template-columns: 1fr 42px; gap: 8px; align-items: center; background: #f7f2e9; border: 1px solid var(--line); border-radius: 8px; padding: 9px; }
    .public-url-row code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; }
    .owner-toggle { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .owner-toggle:last-child { border-bottom: 0; }
    .owner-toggle strong { display: block; font-size: 12px; }
    .owner-toggle span { display: block; color: var(--muted); font-size: 10px; margin-top: 2px; }
    .phone-head { min-height: 128px; background: var(--public-color,#17130f); color: #fffaf0; padding: 20px 14px 14px; }
    .phone-logo { width: 36px; height: 36px; border-radius: 10px; background: #fffaf0; color: var(--public-color,#17130f); display: grid; place-items: center; font-weight: 900; margin-bottom: 10px; }
    .phone-head h2 { margin: 0; color: #fffaf0; font-size: 22px; font-family: Georgia, serif; }
    .phone-head p { margin: 4px 0 12px; color: rgba(255,250,240,.72); font-size: 10px; text-transform: uppercase; letter-spacing: .05em; line-height: 1.4; }
    .phone-contact { display: grid; grid-template-columns: repeat(4,1fr); gap: 5px; }
    .phone-contact button { border: 0; border-radius: 7px; background: rgba(255,250,240,.13); color: #fffaf0; padding: 7px 2px; font-size: 9px; }
    .phone-category-strip { display: flex; gap: 6px; overflow-x: auto; padding: 10px 10px 6px; background: #fffaf0; }
    .phone-category-strip button { flex: none; border: 1px solid var(--line); border-radius: 999px; background: #fff; padding: 6px 10px; color: var(--ink-2); font-size: 10px; font-weight: 700; }
    .phone-category-strip button.active { background: var(--public-color,#17130f); color: #fffaf0; border-color: var(--public-color,#17130f); }
    .phone-section-title { margin: 12px 12px 4px; color: var(--ink); font-size: 12px; font-weight: 850; }
    .phone-food { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; margin: 8px 10px; padding: 10px; background: #fff; border: 1px solid var(--line); border-radius: 9px; align-items: start; }
    .phone-food.no-photo { grid-template-columns: 1fr auto; }
    .phone-food p { margin: 3px 0 5px; color: var(--muted); font-size: 10px; line-height: 1.35; }
    .phone-food-price { color: #80620f; font-weight: 850; font-size: 12px; white-space: nowrap; }
    .phone-thumb { width: 50px; height: 50px; border-radius: 8px; background: #eee7da; display: grid; place-items: center; color: var(--public-color,#17130f); font-weight: 900; }
    .phone-footer { text-align: center; color: var(--muted); padding: 14px 10px 18px; font-size: 9px; }
    .share-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 7px; }
    .status-off { filter: grayscale(1); opacity: .62; }
    @media (max-width: 980px) { .public-control-shell { grid-template-columns: 1fr; } }

    .photo-shell { display: grid; grid-template-columns: minmax(360px, .95fr) minmax(360px, 1fr); gap: 0; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--paper); }
    .photo-editor { border-right: 1px solid var(--line); background: #fffdf8; }
    .photo-tabs { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .photo-tabs .btn { min-height: 46px; line-height: 1.15; }
    .photo-tabs .btn.active, .seg-btn.active { background: #e7f0ff; border-color: #8bb8ff; color: #155eab; }
    .upload-zone { min-height: 170px; border: 1px dashed #b9b1a5; border-radius: 8px; background: #f8f5ee; display: grid; place-items: center; text-align: center; padding: 16px; position: relative; overflow: hidden; }
    .upload-zone.dragging { border-color: var(--gold); background: #fff6d9; }
    .upload-zone img { width: 100%; height: 170px; object-fit: cover; border-radius: 7px; display: block; }
    .photo-overlay { position: absolute; inset: 0; background: rgba(23,19,15,.58); color: #fffaf0; display: none; place-items: center; gap: 8px; }
    .upload-zone.has-image:hover .photo-overlay { display: grid; }
    .upload-progress { height: 7px; border-radius: 999px; background: #e6dfd4; overflow: hidden; margin-top: 10px; }
    .upload-progress div { height: 100%; width: var(--w,0%); background: var(--green); border-radius: inherit; }
    .stock-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .stock-tile { min-height: 76px; border-radius: 8px; border: 1px solid var(--line); color: #fff; font-weight: 850; display: grid; place-items: center; padding: 9px; text-align: center; overflow: hidden; }
    .stock-tile span { display: grid; gap: 4px; place-items: center; font-size: 11px; }
    .stock-tile b { font-size: 22px; line-height: 1; color: rgba(255,255,255,.92); }
    .stock-tile.active { outline: 2px solid var(--gold); outline-offset: 2px; }
    .url-help { margin-top: 10px; border: 1px solid var(--line); border-radius: 8px; background: #fff; padding: 10px 12px; display: grid; gap: 8px; }

    function drawQrCode() {

      const dotType = state.qrStyle === "Dots" ? "dots" : state.qrStyle === "Rounded" ? "rounded" : "square";
      if (window.QRCodeStyling) {
        const qr = new QRCodeStyling({
          width: px,
          height: px,
          type: "svg",
          data: state.qrUrl,
          image: state.qrLogo ? qrLogoDataUri() : "",
          qrOptions: { errorCorrectionLevel: state.qrCorrection },
          dotsOptions: { color: state.qrColor, type: dotType },
          cornersSquareOptions: { color: state.qrColor, type: state.qrStyle === "Rounded" ? "extra-rounded" : "square" },
          cornersDotOptions: { color: state.qrColor, type: state.qrStyle === "Dots" ? "dot" : "square" },
          backgroundOptions: { color: state.qrBg },
          imageOptions: { crossOrigin: "anonymous", margin: 7, imageSize: 0.24 }
        });
        qr.append(mount);
        window.currentQrCode = qr;
        return;
      }
      const img = document.createElement("img");
      img.alt = "Scannable QR code";
      img.src = `https://api.qrserver.com/v1/create-qr-code/?size=${px}x${px}&ecc=${state.qrCorrection}&color=${state.qrColor.replace("#", "")}&bgcolor=${state.qrBg.replace("#", "")}&data=${encodeURIComponent(state.qrUrl)}`;

      const rt = qs("#restaurantTagline");
      if (rt) rt.oninput = e => { state.tagline = e.target.value; renderEditor(); bind(); };
      qsa("[data-export]").forEach(el => el.onclick = () => { setScreen("exports"); toast(`${el.dataset.export} export job queued`); });
      qsa("[data-prompt]").forEach(el => el.onclick = () => { state.aiPrompt = el.dataset.prompt; renderAI(); bind(); });
      const aiRun = qs("#runAI");
      if (aiRun) aiRun.onclick = async () => {
        const prompt = qs("#aiPrompt").value.trim();
        state.aiPrompt = prompt;
        const result = qs("#aiResult");
        if (!prompt) {
          result.textContent = "Type a request first.";
          return;
        }
        result.textContent = "Generating with Anthropic...";
        try {
          const response = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "AI request failed");
          result.textContent = data.text;
        } catch (error) {
          result.textContent = `AI unavailable: ${error.message}. Start the local server with "node server.mjs" and make sure ANTHROPIC_API_KEY is set in .env.`;
        }
      };
      qsa("[data-stage]").forEach(el => el.onclick = () => { state.exportStage = Number(el.dataset.stage); renderExports(); bind(); });
      const newJob = qs("#newJob");
      if (newJob) newJob.onclick = () => toast("New async export job created with status: queued");
      qsa("[data-qr]").forEach(el => el.onclick = () => { state.qrColor = el.dataset.qr; state.qrCustomColor = state.qrColor; renderQR(); bind(); });
      qsa("[data-qr-bg]").forEach(el => el.onclick = () => { state.qrBg = el.dataset.qrBg; state.qrCustomBg = state.qrBg; renderQR(); bind(); });
      qsa("[data-qr-size]").forEach(el => el.onclick = () => { state.qrSize = el.dataset.qrSize; renderQR(); bind(); });
      qsa("[data-qr-style]").forEach(el => el.onclick = () => { state.qrStyle = el.dataset.qrStyle; renderQR(); bind(); });
      qsa("[data-qr-correction]").forEach(el => el.onclick = () => { state.qrCorrection = el.dataset.qrCorrection; renderQR(); bind(); });
      qsa("[data-qr-template]").forEach(el => el.onclick = () => { state.qrTemplate = el.dataset.qrTemplate; renderQR(); bind(); });
      qsa("[data-qr-logo-icon]").forEach(el => el.onclick = () => { state.qrLogoIcon = el.dataset.qrLogoIcon; renderQR(); bind(); });
      const qrLogo = qs("#qrLogo");
      if (qrLogo) qrLogo.onchange = e => { state.qrLogo = e.target.checked; renderQR(); bind(); };
      const qrUrl = qs("#qrUrl");
      if (qrUrl) qrUrl.oninput = e => { state.qrUrl = e.target.value || "https://menucraft.pro/menu/al-nakheel"; drawQrCode(); };
      const qrTop = qs("#qrTop");
      if (qrTop) qrTop.oninput = e => { state.qrTopLabel = e.target.value; const label = qs("#qrTopLabel"); if (label) label.textContent = state.qrTopLabel; };
      const qrBottom = qs("#qrBottom");
      if (qrBottom) qrBottom.oninput = e => { state.qrBottomLabel = e.target.value; const label = qs("#qrBottomLabel"); if (label) label.textContent = state.qrBottomLabel; };
      const qrCustomColor = qs("#qrCustomColor");
      if (qrCustomColor) qrCustomColor.oninput = e => { state.qrCustomColor = e.target.value; state.qrColor = e.target.value; drawQrCode(); };
      const qrCustomBg = qs("#qrCustomBg");
      if (qrCustomBg) qrCustomBg.oninput = e => { state.qrCustomBg = e.target.value; state.qrBg = e.target.value; const card = qs(".qr-live-card"); if (card) card.style.background = state.qrBg; drawQrCode(); };
      const dl = qs("#downloadQR");
      if (dl) dl.onclick = () => window.currentQrCode ? window.currentQrCode.download({ name: "menucraft-qr", extension: "png" }) : toast("QR PNG download ready in production at 300 DPI");
      const dlSvg = qs("#downloadQRSVG");
      if (dlSvg) dlSvg.onclick = () => window.currentQrCode ? window.currentQrCode.download({ name: "menucraft-qr", extension: "svg" }) : toast("QR SVG download ready in production");
      const dlPdf = qs("#downloadQRPDF");
      if (dlPdf) dlPdf.onclick = () => toast(`${state.qrTemplate} PDF download simulated`);
      qsa("[data-public-color]").forEach(el => el.onclick = () => { state.publicColor = el.dataset.publicColor; renderPublic(); bind(); });
      qsa("[data-public-toggle]").forEach(el => el.onchange = e => { state[e.target.dataset.publicToggle] = e.target.checked; renderPublic(); bind(); });
      qsa("[data-public-category]").forEach(el => el.onclick = () => { state.publicCategory = el.dataset.publicCategory; renderPublic(); bind(); });
      const publicName = qs("#publicRestaurantName");
      if (publicName) publicName.oninput = e => { state.publicRestaurant = e.target.value; renderPublic(); bind(); qs("#publicRestaurantName")?.focus(); };
      const publicTagline = qs("#publicTagline");
      if (publicTagline) publicTagline.oninput = e => { state.publicTagline = e.target.value; renderPublic(); bind(); qs("#publicTagline")?.focus(); };
      const publicCurrency = qs("#publicCurrency");
      if (publicCurrency) publicCurrency.onchange = e => {
        const local = currencies.find(c => c[0] === e.target.value);
        const fallbacks = { IDR: ["IDR", "Rp", "Indonesia", []], THB: ["THB", "THB", "Thailand", []], JPY: ["JPY", "JPY", "Japan", []], EUR: ["EUR", "EUR", "Euro", []] };
        state.currency = local || fallbacks[e.target.value] || currencies[0];
        renderPublic();
        bind();
      };
      const copyPublicUrl = qs("#copyPublicUrl");
      if (copyPublicUrl) copyPublicUrl.onclick = async () => {
        try { await navigator.clipboard.writeText("https://menucraft.pro/menu/kusina-ni-lola"); toast("Public menu link copied"); }
        catch { toast("Public menu link copied"); }
      };
      qsa("[data-share]").forEach(el => el.onclick = () => toast(`${el.dataset.share} share link ready: menucraft.pro/menu/kusina-ni-lola`));
      const publishPublic = qs("#publishPublic");
      if (publishPublic) publishPublic.onclick = () => { state.publicLive = !state.publicLive; renderPublic(); bind(); };
      qsa("[data-toggle]").forEach(el => el.onchange = e => { state[e.target.dataset.toggle] = e.target.checked; renderPublic(); bind(); });
      const ps = qs("#publicSearch");
      if (ps) ps.oninput = e => { state.publicSearch = e.target.value; renderPublic(); bind(); qs("#publicSearch")?.focus(); };
      qsa("[data-photo-source]").forEach(el => el.onclick = () => { state.photoSource = el.dataset.photoSource; renderPhotos(); bind(); });
      qsa("[data-photo-fit]").forEach(el => el.onclick = () => { state.photoFit = el.dataset.photoFit; renderPhotos(); bind(); });
      qsa("[data-photo-corner]").forEach(el => el.onclick = () => { state.photoCorner = el.dataset.photoCorner; renderPhotos(); bind(); });
      qsa("[data-photo-size]").forEach(el => el.onclick = () => { state.photoSize = el.dataset.photoSize; renderPhotos(); bind(); });
      qsa("[data-photo-badge]").forEach(el => el.onclick = () => {
        const badge = el.dataset.photoBadge;
        if (state.photoBadges.has(badge)) state.photoBadges.delete(badge);
        else state.photoBadges.add(badge);
        renderPhotos();
        bind();
      });
      qsa("[data-stock-photo]").forEach(el => el.onclick = () => { state.photoStock = el.dataset.stockPhoto; state.photoImage = ""; renderPhotos(); bind(); });
      const updatePhotoField = (id, key) => {
        const el = qs(id);
        if (el) el.oninput = e => { state[key] = e.target.value; renderPhotos(); bind(); qs(id)?.focus(); };
      };
      updatePhotoField("#photoName", "photoName");
      updatePhotoField("#photoDesc", "photoDesc");
      updatePhotoField("#photoPrice", "photoPrice");
      const photoUrl = qs("#photoUrl");
      if (photoUrl) photoUrl.oninput = e => { state.photoUrl = e.target.value; };
      const loadPhotoUrl = qs("#loadPhotoUrl");
      if (loadPhotoUrl) loadPhotoUrl.onclick = () => {
        const url = (qs("#photoUrl")?.value || "").trim();
        if (!url) return toast("Paste an image URL first");
        state.photoUrl = url;
        state.photoImage = url;
        state.photoStock = "none";
        renderPhotos();
        bind();
        toast("Image loaded from URL");
      };
      const handlePhotoFile = (file) => {
        if (!file) return;
        if (!file.type.match(/^image\/(png|jpeg|webp)$/)) return toast("Use PNG, JPG, or WebP");
        if (file.size > 10 * 1024 * 1024) return toast("Image must be 10 MB or smaller");
        state.photoUploadProgress = 12;
        renderPhotos();
        bind();
        const reader = new FileReader();
        reader.onload = () => {
          let progress = 28;
          const tick = setInterval(() => {
            progress += 24;
            state.photoUploadProgress = Math.min(progress, 96);
            renderPhotos();
            bind();
            if (progress >= 96) {
              clearInterval(tick);
              state.photoImage = reader.result;
              state.photoStock = "none";
              state.photoUploadProgress = 100;
              renderPhotos();
              bind();
              toast("Food photo uploaded and optimised");
            }
          }, 120);
        };
        reader.readAsDataURL(file);
      };
      const photoFile = qs("#photoFile");
      if (photoFile) photoFile.onchange = e => handlePhotoFile(e.target.files?.[0]);
      const up = qs("#simulateUpload");
      if (up) up.onclick = () => qs("#photoFile")?.click();
      const replacePhoto = qs("#replacePhoto");
      if (replacePhoto) replacePhoto.onclick = () => qs("#photoFile")?.click();
      const removePhoto = qs("#removePhoto");
      if (removePhoto) removePhoto.onclick = () => { state.photoImage = ""; state.photoStock = "none"; renderPhotos(); bind(); toast("Photo removed"); };
      const dropZone = qs("#photoDropZone");
      if (dropZone) {
        dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add("dragging"); };
        dropZone.ondragleave = () => dropZone.classList.remove("dragging");
        dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove("dragging"); handlePhotoFile(e.dataTransfer.files?.[0]); };
      }
      const savePhotoItem = qs("#savePhotoItem");
      if (savePhotoItem) savePhotoItem.onclick = () => toast(`${state.photoName} saved with ${state.photoBadges.size} badges`);
      qsa("[data-currency]").forEach(el => el.onclick = () => { state.currency = currencies.find(c => c[0] === el.dataset.currency); renderCurrency(); renderEditor(); renderPublic(); bind(); });
      qsa("[data-currency-code]").forEach(el => el.onclick = () => {
        state.currency = [el.dataset.currencyCode, el.querySelector(".currency-symbol")?.textContent || el.dataset.currencyCode, "", []];
        state.decimals = Number(el.dataset.decimalsDefault || 0);
        state.currencyThousands = el.dataset.sepDefault || ",";
        renderCurrency(); renderEditor(); renderPublic(); bind();
      });
      const currencySearch = qs("#currencySearch");
      if (currencySearch) currencySearch.oninput = e => { state.currencySearch = e.target.value; renderCurrency(); bind(); qs("#currencySearch")?.focus(); };
      qsa("[data-symbol-position]").forEach(el => el.onclick = () => { state.currencySymbolPosition = el.dataset.symbolPosition; renderCurrency(); bind(); });
      qsa("[data-thousands]").forEach(el => el.onclick = () => { state.currencyThousands = el.dataset.thousands; renderCurrency(); bind(); });
      const decDown = qs("#decDown");
      if (decDown) decDown.onclick = () => { state.decimals = Math.max(0, state.decimals - 1); renderCurrency(); bind(); };
      const decUp = qs("#decUp");
      if (decUp) decUp.onclick = () => { state.decimals = Math.min(3, state.decimals + 1); renderCurrency(); bind(); };
      const dec = qs("#decimals");
      if (dec) dec.onclick = () => { state.decimals = (state.decimals + 1) % 4; renderCurrency(); bind(); };
      const saveC = qs("#saveCurrency");
      if (saveC) saveC.onclick = () => toast(`Currency saved: ${state.currency[0]}`);
      qsa("[data-schema-tab]").forEach(el => el.onclick = () => { state.schemaTab = el.dataset.schemaTab; renderSchema(); bind(); });
      qsa("[data-auth-flow]").forEach(el => el.onclick = () => { state.authFlow = el.dataset.authFlow; renderAuth(); bind(); });
      qsa("[data-full-screen]").forEach(el => el.onclick = () => { state.fullScreen = el.dataset.fullScreen; renderFullUI(); bind(); });
      qsa("[data-full-filter]").forEach(el => el.onclick = () => { state.fullTemplateFilter = el.dataset.fullFilter; renderFullUI(); bind(); });
      qsa("[data-full-template]").forEach(el => el.onclick = () => { state.fullScreen = "Editor"; renderFullUI(); bind(); toast(`${el.dataset.fullTemplate} opened in editor`); });
      qsa("[data-full-prompt]").forEach(el => el.onclick = () => { state.fullAiPrompt = el.dataset.fullPrompt; renderFullUI(); bind(); });
      const fullSignIn = qs("#fullSignIn");
      if (fullSignIn) fullSignIn.onclick = () => { state.fullScreen = "Dashboard"; renderFullUI(); bind(); toast("Signed in as Rashed"); };
      const fullGoogle = qs("#fullGoogle");
      if (fullGoogle) fullGoogle.onclick = () => toast("Google OAuth flow opened");
      const fullCreate = qs("#fullCreate");
      if (fullCreate) fullCreate.onclick = () => toast("Create account flow opened");
      const fullPrompt = qs("#fullAiPrompt");
      if (fullPrompt) fullPrompt.oninput = e => { state.fullAiPrompt = e.target.value; };
      const fullRunAI = qs("#fullRunAI");
      if (fullRunAI) fullRunAI.onclick = async () => {
        const prompt = (qs("#fullAiPrompt")?.value || "").trim();
        state.fullAiPrompt = prompt;
        const result = qs("#fullAiResult");
        if (!prompt) {
          result.textContent = "Type a menu copywriting request first.";
          return;
        }
        result.textContent = "Generating with Claude...";
        try {
          const response = await fetch("/api/ai", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt })
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || "AI request failed");
          state.fullAiResult = data.text;
          result.textContent = data.text;
        } catch (error) {
          state.fullAiResult = `AI unavailable: ${error.message}. Start the local server with "node server.mjs" and make sure ANTHROPIC_API_KEY is set in .env.`;
          result.textContent = state.fullAiResult;
        }
      };
      qsa("[data-admin-section]").forEach(el => el.onclick = () => { state.adminSection = el.dataset.adminSection; renderAdmin(); bind(); });
      qsa("[data-admin-filter]").forEach(el => el.onclick = () => { state.adminFilter = el.dataset.adminFilter; renderAdmin(); bind(); });
      qsa("[data-ticket-filter]").forEach(el => el.onclick = () => { state.ticketFilter = el.dataset.ticketFilter; renderAdmin(); bind(); });
      qsa("[data-audit-filter]").forEach(el => el.onclick = () => { state.auditFilter = el.dataset.auditFilter; renderAdmin(); bind(); });
      qsa("[data-flag-key]").forEach(el => el.onchange = e => { state.flags[e.target.dataset.flagKey] = e.target.checked; renderAdmin(); bind(); });
      qsa("[data-billing]").forEach(el => el.onclick = () => { state.billing = el.dataset.billing; renderPricing(); bind(); });
      const pricingCurrency = qs("#pricingCurrency");
      if (pricingCurrency) pricingCurrency.onchange = e => { state.pricingCurrency = e.target.value.split("|").map((v, i) => i === 2 ? Number(v) : v); renderPricing(); bind(); };
      qsa("[data-faq]").forEach(el => el.onclick = () => {
        const index = Number(el.dataset.faq);
        if (state.openFaqs.has(index)) state.openFaqs.delete(index);
        else state.openFaqs.add(index);
        renderPricing();
        bind();
      });
    }

    renderAll();
  </script>
</body>
</html>
