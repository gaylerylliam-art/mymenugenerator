[build]
  command = "node scripts/build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "node server.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
